<form method="post" enctype="multipart/form-data" class="tg-compose" action="{% url 'chat-room' conversation.pk %}" data-chat-form data-max-bytes="{{ chat_max_upload_bytes }}">
  {% csrf_token %}
  <input type="hidden" name="attachment_kind" value="" data-attachment-kind>
  {% if form.non_field_errors %}<div class="form-error-box">{{ form.non_field_errors }}</div>{% endif %}
  {% if form.attachment.errors %}<div class="form-error-box">{{ form.attachment.errors|striptags }}</div>{% endif %}
  <div class="tg-attachment" data-attachment-preview hidden>
    <span class="tg-attachment-icon" aria-hidden="true">📎</span>
    <span class="tg-attachment-name" data-attachment-name data-no-translate="true"></span>
    <button type="button" class="tg-attachment-remove" data-attachment-remove aria-label="Faylni olib tashlash">×</button>
  </div>
  <div class="tg-progress" data-upload-progress hidden><span></span></div>
  <div class="tg-compose-row">
    <label class="tg-icon-btn" for="chat-attachment" title="Rasm, video yoki audio biriktirish" aria-label="Rasm, video yoki audio biriktirish">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 6.5v10a4.5 4.5 0 0 1-9 0V5a3 3 0 0 1 6 0v10.5a1.5 1.5 0 0 1-3 0V6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </label>
    <input id="chat-attachment" type="file" name="attachment" accept="image/*,video/*,audio/*" class="tg-file-input">
    <label class="visually-hidden" for="{{ form.text.id_for_label }}">Xabar</label>
    {{ form.text }}
    <button type="button" class="tg-icon-btn" data-record-audio title="Ovozli xabar yozish" aria-label="Ovozli xabar yozish">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button type="submit" class="tg-send" title="Yuborish" aria-label="Yuborish">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-4 16-4.5-6.5L4 12Z" fill="currentColor"/></svg>
    </button>
  </div>
  <p class="tg-status" data-record-status aria-live="polite"></p>
  <p class="tg-hint">Rasm, video yoki audio — {{ chat_max_upload_mb }} MB gacha</p>
</form>
