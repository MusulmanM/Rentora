{% load static %}<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f4">
  <meta name="description" content="Rentora — O'zbekistonda uy va avtomobilni oson toping va bron qiling.">
  <title>{% block title %}Rentora — turar joy va avtomobil ijarasi{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'core/app.css' %}">
  <link rel="stylesheet" href="{% static 'core/account.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="toast-stack" aria-live="polite">{% if messages %}{% for message in messages %}<div class="toast toast-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}{% endif %}</div>
  {% block content %}{% endblock %}
  <script src="{% static 'core/i18n.js' %}" defer></script>
  <script src="{% static 'core/app.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
