# Rentora: web app + Telegram bot (long polling), sharing one SQLite/media volume.
#
#   cp .env.example .env      # fill in secrets and the public address
#   docker compose up -d --build
#
# The site listens on RENTORA_PORT (default 8090).
name: rentora

services:
  web:
    build: .
    image: rentora:latest
    env_file: .env
    ports:
      - "${RENTORA_PORT:-8090}:8000"
    volumes:
      - rentora-data:/data
    restart: unless-stopped

  bot:
    image: rentora:latest
    env_file: .env
    environment:
      RUN_MIGRATIONS: "0"
    command: ["python", "manage.py", "run_telegram_bot"]
    volumes:
      - rentora-data:/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rentora-data:
