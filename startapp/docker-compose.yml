# Rentora: web app + Telegram bot + support AI, sharing one SQLite/media volume.
#
#   cp .env.example .env      # fill in secrets and the public address
#   docker compose up -d --build
#
# The site listens on 127.0.0.1:RENTORA_PORT (default 8090): put a tunnel (cloudflared) or a reverse
# proxy in front of it. Data (SQLite, uploads, chat media) lives in RENTORA_DATA (a folder or a volume).
# With a domain pointed at the server, add HTTPS (free Let's Encrypt certificate via Caddy):
#   DOMAIN=rentora.uz docker compose --profile https up -d
name: rentora

x-app: &app
  image: rentora:latest
  env_file: .env
  volumes:
    - ${RENTORA_DATA:-rentora-data}:/data
  restart: unless-stopped

services:
  web:
    <<: *app
    build: .
    ports:
      - "127.0.0.1:${RENTORA_PORT:-8090}:8000"

  bot:
    <<: *app
    environment:
      RUN_MIGRATIONS: "0"
    command: ["python", "manage.py", "run_telegram_bot"]
    healthcheck:
      disable: true  # no web server in this container
    depends_on:
      web:
        condition: service_healthy

  support-ai:
    <<: *app
    environment:
      RUN_MIGRATIONS: "0"
    command: ["python", "manage.py", "run_support_ai"]
    healthcheck:
      disable: true  # no web server in this container
    depends_on:
      web:
        condition: service_healthy

  reminders:
    <<: *app
    environment:
      RUN_MIGRATIONS: "0"
    # Rental-end and late-return Telegram reminders, checked every hour.
    command: ["python", "manage.py", "send_rental_reminders", "--every", "3600"]
    healthcheck:
      disable: true  # no web server in this container
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2.8
    profiles: ["https"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  rentora-data:
  caddy-data:
